name: Publish Academic Adventure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Build browser game
        run: |
          python -m pip install pygbag==0.9.3
          python tools/prepare_web.py "$RUNNER_TEMP/academic-adventure"
          python -m pygbag --build "$RUNNER_TEMP/academic-adventure"
          test -s "$RUNNER_TEMP/academic-adventure/build/web/index.html"
          python tools/add_mobile_ui.py "$RUNNER_TEMP/academic-adventure/build/web"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/academic-adventure/build/web
      - uses: actions/deploy-pages@v4
        id: deployment
